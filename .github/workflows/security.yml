name: Linux Hardener CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    name: ShellCheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'
      - name: Run tests
        run: |
          chmod +x harden.sh tests/test_harden.sh
          ./tests/test_harden.sh
      - name: Check-only en Ubuntu
        run: |
          ./harden.sh --check-only || true
          ls -lh reports/