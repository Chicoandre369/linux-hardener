name: Linux Hardener CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shellcheck:
    name: ShellCheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck - solo errores graves
        run: |
          shellcheck --severity=error harden.sh tests/test_harden.sh
          echo "ShellCheck OK - sin errores graves"
      - name: Run tests
        run: |
          chmod +x harden.sh tests/test_harden.sh
          ./tests/test_harden.sh
      - name: Check-only en Ubuntu
        run: |
          ./harden.sh --check-only || true
          ls -lh reports/
